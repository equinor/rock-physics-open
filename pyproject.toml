[build-system]
requires = ["setuptools >= 69.5.1", "setuptools_scm[toml] >= 7.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/rock_physics_open/version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.dll", "*.so", "*.ini", "*.h5", "*.pkl", "py.typed"]

[project]
name = "rock_physics_open"
description = "Equinor Rock Physics Module"
authors = [
    { name = "Harald Flesche", email = "hfle@equinor.com" },
    { name = "Eivind Jahren", email = "ejah@equinor.com" },
    { name = "Jimmy Zurcher", email = "jiz@equinor.com" },
]
maintainers = [
    { name = "Harald Flesche", email = "hfle@equinor.com" },
    { name = "Eirik Ola Aksnes", email = "eoaksnes@equinor.com" },
    { name = "Sivert Utne", email = "sutn@equinor.com" },
    { name = "Einar Wigum Arbo", email = "earb@equinor.com" },
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
keywords = [
    "energy",
    "subsurface",
    "seismic",
    "rock physics",
    "scientific",
    "engineering",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
]
dynamic = ["version"]
# Minimum dependency versions are set to either:
# - the first version that supports Python 3.11
# - the first version that supports a feature we require
dependencies = [
    "numpy >= 1.23.3",
    "pandas >= 2.0.0",
    "matplotlib >= 3.6.0",
    "scipy >= 1.10.0",
    "scikit-learn >= 1.2.0",
    "tmatrix ~= 1.2.0",
    "typing-extensions >= 4.7.0",
]


[project.urls]
Repository = "https://github.com/equinor/rock-physics-open"
Homepage = "https://github.com/equinor/rock-physics-open"
Changelog = "https://github.com/equinor/rock-physics-open/blob/main/CHANGELOG.md"

[dependency-groups]
# Pinned to exact versions for consistent dev environments
dev = [
    "basedpyright == 1.38.2",
    "matplotlib-stubs == 0.3.11",
    "pandas-stubs == 3.0.0.260204",
    "pre-commit == 4.5.1",
    "pytest == 9.0.2",
    "pytest-cov == 7.0.0",
    "ruff == 0.15.5",
    "scipy-stubs == 1.17.1.1",
]

[tool.ruff]
lint.select = [
    "C",       # Complexity
    "E",       # Errors
    "F",       # Flake (unused variables etc.)
    "I",       # Imports
    "NPY",     # Numpy
    "PIE",     # Python idioms and style
    "PLR1711", # Redundant Return
    "PT",      # PyTest
    "Q",       # Quotes
    "RET",     # Return statements
    "RSE",     # Raising exceptions
    "SIM",     # Code simplification
    "W",       # Warnings
]
lint.ignore = [
    "C901", # Complex Code (too many branches/statements)
    "E501", # Line Too Long
]
line-length = 88

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]

[tool.pytest.ini_options]
addopts = ["--color=yes", "--strict-markers"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["src/rock_physics_open/version.py"]
allowedUntypedLibraries = [
    "pandas",
    "sklearn",
    "tkinter",
    "matplotlib.pyplot",
    "matplotlib",
    "pyplot",
    "plt",
    "scipy",
]
executionEnvironments = [
    { root = "tests", reportUninitializedInstanceVariable = false, reportPrivateUsage = false, reportUnannotatedClassAttribute = false },
]
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
