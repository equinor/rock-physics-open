version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # checks workflow files in ".github/workflows"
    schedule:
      interval: "monthly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "production"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "development"
    groups:
      dev-dependencies:
        patterns:
          - "*"
