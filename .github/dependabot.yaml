version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      ci:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    groups:
      prod:
        dependency-type: "production"
      dev:
        dependency-type: "development"
      security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    groups:
      pre-commit:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
